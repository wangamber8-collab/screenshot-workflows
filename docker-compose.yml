services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  ollama:
    build:
      context: .
      dockerfile: docker/ollama.Dockerfile
    ports: 
      - "11434:11434"
    restart: unless-stopped
    volunes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    
  vision:
    build:
      context: .
      dockerfile: docker/vision.Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
  
  embedding:
    build:
      context: .
      dockerfile: docker/embedding.Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped

  grouping:
    build:
      context: .
      dockerfile: docker/grouping.Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
volumes:
  ollama_data: