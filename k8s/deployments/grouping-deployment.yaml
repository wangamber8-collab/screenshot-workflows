apiVersion: apps/v1
kind: Deployment
metadata:
  name: grouping-deployment
spec:
  selector:
    matchLabels:
      app: grouping
  template:
    metadata:
      labels:
        app: grouping
    spec:
      containers:
        - name: grouping-container
          image: grouping-service:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "services.celery_app", "worker", "--queues", "grouping", "--loglevel", "info", "--concurrency", "1"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: OLLAMA_URL
              value: "http://ollama:11434"