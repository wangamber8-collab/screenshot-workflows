apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-deployment
spec:
  selector:
    matchLabels:
      app: embedding
  template:
    metadata:
      labels:
        app: embedding
    spec:
      containers:
        - name: embedding-container
          image: embedding-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: OLLAMA_URL
              value: "http://ollama:11434"